name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # smaltdb and smaltts are not on npm yet: build the commits pinned in packed.json and install them.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: npm run deps
      # dist/ first: the tests import the package by name, and the typecheck reads its declarations.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
  # The store through smaltdb's client in each browser (test/browser/). As smaltts's: Playwright's image has its
  # browsers; Playwright itself is installed globally, pinned with the image, not as a dependency.
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_VERSION: 1.64.1
      NPM_CONFIG_PREFIX: /tmp/npm-global
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: npm run deps
      - run: npm install -g playwright@${{ env.PLAYWRIGHT_VERSION }}
        timeout-minutes: 5
      - run: NODE_PATH=$(npm root -g) BROWSERS=${{ matrix.browser }} npm run test:browser
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on dead links.
      - run: npm run docs:build
